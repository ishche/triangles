[project]
name = "domeprint"
version = "0.1.0"
description = "Print-ready paper templates (cut + fold lines, glue tabs) for geodesic dome triangles."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Iurii Shchekochikhin", email = "amagex@gmail.com" }]
keywords = ["geodesic dome", "papercraft", "template", "svg", "pdf", "nesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Repository = "https://github.com/ishche/triangles"

[project.scripts]
domeprint = "domeprint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pypdf>=6.21.2",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow ×, —, ° in strings and comments
    "B905",  # zip() pairs lists of different length on purpose (e.g. no tabs vs 3 edges)
]
